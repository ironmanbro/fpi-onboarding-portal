<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>FPI Onboarding Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E8601C'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='12' font-weight='700' fill='white' text-anchor='middle'%3EFPI%3C/text%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with application facts, left journey rail (collapses to a drawer on phones), one section per screen with a sticky action bar. */
:root{
  --bg:#F6F3F1; --surface:#FFFFFF; --surface-2:#FAF7F5; --ink:#241815; --muted:#6B5D58; --line:#E7DFDB; --line-strong:#D2C6C0;
  --accent:#AE282E; --accent-ink:#FFFFFF; --accent-soft:#FBEBE7; --accent-hover:#8C1F24;
  --cta:#E8601C; --cta-ink:#FFFFFF; --cta-hover:#C94E12;
  --warn:#9A6212; --warn-soft:#FBF0DC; --danger:#B42318; --danger-soft:#FDEBE8; --ok:#1E7445; --ok-soft:#E3F3E8;
  --info:#2B5B8A; --info-soft:#E6EEF7;
  --shadow:0 1px 2px rgba(36,24,21,.06),0 4px 16px rgba(36,24,21,.05);
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16100E; --surface:#1F1715; --surface-2:#261C19; --ink:#F2E9E6; --muted:#B09F99; --line:#3A2C28; --line-strong:#4D3C37;
  --accent:#F28C70; --accent-ink:#2A0E08; --accent-soft:#3D1E19; --accent-hover:#F6A68F;
  --cta:#F37021; --cta-ink:#FFFFFF; --cta-hover:#F5853F;
  --warn:#E3AB52; --warn-soft:#382A12; --danger:#F07D70; --danger-soft:#3B1916; --ok:#5DC88E; --ok-soft:#14301F;
  --info:#83B2E0; --info-soft:#172A3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16100E; --surface:#1F1715; --surface-2:#261C19; --ink:#F2E9E6; --muted:#B09F99; --line:#3A2C28; --line-strong:#4D3C37;
  --accent:#F28C70; --accent-ink:#2A0E08; --accent-soft:#3D1E19; --accent-hover:#F6A68F;
  --cta:#F37021; --cta-ink:#FFFFFF; --cta-hover:#F5853F;
  --warn:#E3AB52; --warn-soft:#382A12; --danger:#F07D70; --danger-soft:#3B1916; --ok:#5DC88E; --ok-soft:#14301F;
  --info:#83B2E0; --info-soft:#172A3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* Header */
.top::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--cta),#AE282E)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-row{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:15px;white-space:nowrap}
.mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--cta),#AE282E);color:#FFFFFF;display:grid;place-items:center;font:600 12px var(--f-mono)}
.facts{display:flex;gap:6px 18px;flex-wrap:wrap;flex:1;min-width:0;align-items:center}
.fact{display:flex;flex-direction:column;line-height:1.25}
.fact small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fact b{font-weight:600;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.draft{background:var(--warn-soft);color:var(--warn)}
.pill.sub{background:var(--ok-soft);color:var(--ok)}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}

/* Shell */
.shell{display:grid;grid-template-columns:288px minmax(0,1fr);gap:24px;max-width:1360px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 0}
aside.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-bottom:24px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline}
.prog-top b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.prog p{margin:8px 0 0;color:var(--muted);font-size:12.5px}
nav.steps{display:flex;flex-direction:column;gap:2px}
.step{border-radius:var(--r)}
.step-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:var(--r);text-align:left;font-weight:600}
.step-h:hover{background:var(--surface)}
.step.on .step-h{background:var(--surface);box-shadow:var(--shadow)}
.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 11.5px var(--f-mono);border:1.5px solid var(--line-strong);color:var(--muted);flex:none;background:var(--surface)}
.num.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.num.part{border-color:var(--accent);color:var(--accent)}
.step-h .cnt{margin-left:auto;font:500 11.5px var(--f-mono);color:var(--muted)}
.subs{list-style:none;margin:2px 0 8px 21px;padding:0 0 0 12px;border-left:1.5px solid var(--line)}
.subs button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;color:var(--muted);font-size:13px}
.subs button:hover{color:var(--ink);background:var(--surface)}
.subs button.on{color:var(--ink);font-weight:600;background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--line-strong)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.part{background:linear-gradient(90deg,var(--warn) 50%,transparent 50%);border-color:var(--warn)}
.rail-foot{margin-top:16px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.linkbtn{border:0;background:none;color:var(--accent);padding:4px 10px;text-align:left;font-weight:600;font-size:12.5px}
.linkbtn:hover{text-decoration:underline}

/* Main */
main{min-width:0;padding-bottom:24px}
.crumb{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.sec-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.sec-head h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.sec-meta{font-size:12.5px;color:var(--muted);white-space:nowrap}
.sec-meta b{color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 18px}
.full{grid-column:1/-1}.s2{grid-column:span 2}
.sub{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700;padding-top:10px;border-top:1px solid var(--line);margin-top:4px}
.sub:first-child{border-top:0;padding-top:0;margin-top:0}
.note{margin:0;color:var(--muted);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.note.info{background:var(--info-soft);border-color:transparent;color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink);display:flex;gap:4px;align-items:center}
.req{color:var(--danger)}
.opt{color:var(--muted);font-weight:400}
.in,.sel,textarea.in{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:9px 11px;min-height:38px;transition:border-color .15s,box-shadow .15s}
textarea.in{min-height:76px;resize:vertical}
.in:hover,.sel:hover{border-color:var(--muted)}
.in:focus,.sel:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in[readonly]{background:var(--surface-2);color:var(--muted)}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.phone{display:grid;grid-template-columns:minmax(0,118px) minmax(0,1fr);gap:6px}
.err .in,.err .sel,.err .seg{border-color:var(--danger)}
.msg{font-size:12px;color:var(--danger)}
.hint{font-size:12px;color:var(--muted)}
.tip{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--line);color:var(--muted);font-size:10px;font-weight:700;position:relative;cursor:help}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);width:240px;background:var(--ink);color:var(--bg);font-weight:400;font-size:12px;line-height:1.4;padding:8px 10px;border-radius:6px;z-index:20;text-transform:none;letter-spacing:0}
.fld .seg{align-self:flex-start;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:7px 14px;font-size:13px;font-weight:500;border-right:1px solid var(--line);white-space:nowrap}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.q{display:flex;justify-content:space-between;gap:12px 24px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.q .qt{flex:1 1 360px;min-width:0;font-size:13.5px}
.q.err .qt::after{content:" · Required";color:var(--danger);font-size:12px}
.q+.sub,.q+.note{margin-top:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:7px;padding:10px 12px;cursor:pointer;background:var(--surface);font-size:13.5px}
.choice:hover{border-color:var(--line-strong)}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:3px;accent-color:var(--accent)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 16px}
.ck{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer;padding:3px 0}
.ck input,td input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th{background:var(--surface-2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .in,td .sel{min-height:34px;padding:6px 9px}
td .sel{padding-right:28px}
td.c,th.c{text-align:center}
td.n{color:var(--muted);font:500 12px var(--f-mono);width:36px}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.icon-btn{border:0;background:none;color:var(--muted);padding:6px;border-radius:6px;display:grid;place-items:center}
.icon-btn:hover{background:var(--danger-soft);color:var(--danger)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
.total{font:500 12.5px var(--f-mono)}
.total.bad{color:var(--danger)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:7px;padding:9px 16px;font-weight:600;font-size:13.5px;border:1px solid transparent;white-space:nowrap}
.btn.pri{background:var(--cta);color:var(--cta-ink)}
.btn.pri:hover{background:var(--cta-hover)}
.btn.sec{background:var(--surface);border-color:var(--line-strong)}
.btn.sec:hover{border-color:var(--muted)}
.btn.ghost{background:none;color:var(--accent);padding-inline:8px}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{position:sticky;bottom:0;z-index:15;margin-top:18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actions .sp{flex:1}
.actions .hint{white-space:nowrap}

/* Docs */
.doc-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.doc-tools .in{max-width:260px}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dgroup{margin-bottom:18px}
.dgroup h3{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.dgroup h3 span{font:500 12px var(--f-mono);color:var(--muted)}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.drow:last-child{border-bottom:0}
.dlist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dname{display:flex;flex-direction:column;min-width:0}
.dname b{font-weight:600;font-size:13.5px}
.dname small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;justify-self:start;white-space:nowrap}
.st.gen{background:var(--info-soft);color:var(--info)}
.st.pend{background:var(--danger-soft);color:var(--danger)}
.st.up{background:var(--ok-soft);color:var(--ok)}
.st.none{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.dact{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.cmt{grid-column:1/-1;display:flex;gap:8px}
.cmt .in{flex:1}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

/* Review */
.rv{display:grid;gap:14px}
.rv-step{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rv-step h3{font-size:14px;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.rv-row{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rv-row:last-child{border-bottom:0}
.rv-row .t{flex:1;min-width:0;display:flex;gap:10px;align-items:center}
.rv-row small{color:var(--muted);display:block;font-size:12px}
.done-banner{display:flex;gap:16px;align-items:flex-start;background:var(--ok-soft);border-radius:var(--r);padding:18px;margin-bottom:16px}
.done-banner b{font-size:16px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:9px;display:flex;gap:14px;align-items:center;font-size:13.5px;z-index:50;transition:.2s;max-width:calc(100vw - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:0}
.scrim{display:none}

@media (max-width:1080px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.s2{grid-column:1/-1}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);padding-top:16px}
  .menu-btn{display:inline-flex}
  aside.rail{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);max-height:none;z-index:60;background:var(--bg);
    padding:calc(16px + env(safe-area-inset-top,0px)) 14px 24px max(14px,env(safe-area-inset-left,0px));transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow)}
  body.nav-open aside.rail{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  .facts .fact.opt-hide{display:none}
}
@media (max-width:620px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .s2{grid-column:auto}
  .card{padding:16px}
  .sec-head h1{font-size:20px}
  .drow{grid-template-columns:minmax(0,1fr) auto}
  .drow .dact{grid-column:1/-1;justify-content:flex-start}
  .facts{display:none}
  .actions .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Applications home */
button.brand{border:0;background:none;padding:0;color:inherit}
body.home .shell{grid-template-columns:minmax(0,1fr);max-width:1100px}
body.home aside.rail,body.home .menu-btn,body.home .facts{display:none}
.banner{background:var(--info-soft);border-radius:var(--r);padding:12px 14px;font-size:13px;margin-bottom:16px}
.alist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.arow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 170px 120px auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow.head{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding-block:9px}
.arow .nm{min-width:0}
.arow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .nm small{color:var(--muted);font:500 12px var(--f-mono)}
.mini{display:flex;align-items:center;gap:8px;font:500 12px var(--f-mono)}
.mini .bar{flex:1;margin:0;height:5px}
.arow .sel{min-height:32px;padding:5px 28px 5px 9px;font-size:12.5px}
.arow .when{font-size:12px;color:var(--muted)}
.arow .dact{flex-wrap:nowrap}
.icon-btn.danger{color:var(--danger)}

/* Roles, login and workflow */
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap;margin-left:auto}
.who:empty{display:none}
.facts+.saved{margin-left:0}
.role{font:600 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.pill.s-info{background:var(--info-soft);color:var(--info)}
.pill.s-bad{background:var(--danger-soft);color:var(--danger)}
.login{max-width:1040px;margin:0 auto;display:grid;gap:20px;padding-top:12px}
.login h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.login>div>p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.rcard:focus-within{border-color:var(--accent)}
.rcard .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:600 12px var(--f-mono)}
.rcard h2{font-size:17px;font-weight:700}
.rcard ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:grid;gap:3px;flex:1}
.rcard .btn{width:100%}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.flow b{color:var(--ink);font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.wf{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px}
.wf>summary{list-style:none;cursor:pointer;display:flex;gap:10px 14px;align-items:center;padding:14px 18px;flex-wrap:wrap}
.wf>summary::-webkit-details-marker{display:none}
.wf>summary::after{content:"Show";margin-left:auto;font-size:12px;font-weight:600;color:var(--accent)}
.wf[open]>summary::after{content:"Hide"}
.wf-next{flex:1 1 260px;min-width:0;font-size:13.5px}
.wf-body{padding:16px 18px 18px;display:grid;gap:18px;border-top:1px solid var(--line)}
.wf h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:8px}
.wf-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.compose{display:grid;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:12px}
.compose .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.compose .sel{max-width:320px}
.qlist{display:grid;gap:10px}
.qi{border:1px solid var(--line);border-radius:7px;padding:12px 14px;display:grid;gap:8px}
.qi.open{background:var(--danger-soft);border-color:transparent}
.qi .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qi .ans{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.qi .row{display:flex;gap:8px;flex-wrap:wrap}
.qi .row .in{flex:1 1 240px}
.tl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px;font-size:13px}
.tl li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}
.tl time{color:var(--muted);font:500 12px var(--f-mono)}
.tl small{color:var(--muted)}
.wf details>summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--accent)}
.regno{font:600 13px var(--f-mono);background:var(--ok-soft);color:var(--ok);padding:3px 9px;border-radius:6px}
.lockbar{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:9px 12px;font-size:13px;margin-bottom:14px;color:var(--muted)}
.st.ver{background:var(--ok-soft);color:var(--ok)}
.st.rej{background:var(--danger-soft);color:var(--danger)}
.drow .rej-note{grid-column:1/-1;display:flex;gap:8px}
.drow .rej-note .in{flex:1}
.arow .nx{font-size:12px;color:var(--muted);display:block;margin-top:2px}
@media (max-width:820px){.roles{grid-template-columns:minmax(0,1fr)}.tl li{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.who span:not(.role){display:none}}
@media (max-width:760px){
  .arow{grid-template-columns:minmax(0,1fr) auto}
  .arow.head{display:none}
  .arow .mini,.arow .when{grid-column:1/-1}
  .arow .sel{grid-column:1}
}
</style>

</head>

<header class="top">
  <div class="top-row">

    <div class="who" id="who"></div>

</header>

 {id:"prior",title:"Prior association",desc:"Earlier registrations with Indian securities markets.",fields:[

/* Completion of a section: count required, visible values */
function status(sec){
 if(sec.custom==="docs"){const d=docList().filter(x=>x.need);const done=d.filter(x=>x.s==="up").length;return {req:d.length,done,miss:d.filter(x=>x.s!=="up").map(x=>x.name)}}
 if(sec.custom==="review")return {req:0,done:0,miss:[]};
 let req=0,done=0;const miss=[];
 for(const f of sec.fields){
  if(!vis(f))continue;
  if(f.type==="table"){
   const rows=S[f.id]||[];req++;
   const ok=rows.length>=(f.min||0)&&rows.every(r=>f.cols.every(c=>!c.req||!isEmpty(r[c.k])));
   if(ok)done++;else miss.push(f.label);continue;
  }
  if(f.type==="derived"){
   const ps=parties().filter(f.filter),store=S[f.id]||{};
   for(const p of ps){req++;const r=store[p._id]||{};if(f.cols.every(c=>!c.req||!isEmpty(r[c.k])))done++;else miss.push(f.label+" · "+p.name)}
   if(f.total){const t=ps.reduce((a,p)=>a+(parseFloat((store[p._id]||{})[f.total])||0),0);if(t>100){req++;miss.push("Shareholding adds up to more than 100%")}}
   continue;
  }
  if(!f.req||!f.id)continue;
  req++;if(!isEmpty(S[f.id]))done++;else miss.push(f.label);
 }
 return {req,done,miss};
}
const stateOf=st=>st.req===0?"done":st.done>=st.req&&!st.miss.length?"done":st.done===0?"todo":"part";
function totals(){let r=0,d=0;STEPS.forEach(s=>s.sections.forEach(x=>{const t=status(x);r+=t.req;d+=Math.min(t.done,t.req)}));return {r,d,pct:r?Math.round(d/r*100):0}}

  case "phone":return `<div class="phone"><select class="sel" id="i-${f.id}-cc" data-k="${f.id}_cc" aria-label="Country code"><option value="">Code</option>${[...new Set(COUNTRIES.map(c=>c[1]))].map(c=>`<option${c===S[f.id+"_cc"]?" selected":""}>${c}</option>`).join("")}</select><input class="in mono" id="i-${f.id}" data-k="${f.id}" inputmode="tel" value="${esc(v)}" aria-label="${esc(f.label)}"></div>`;

const seg=(f,opts)=>`<div class="seg" role="radiogroup" aria-label="${esc(f.label)}">${opts.map((o,i)=>`<label><input type="radio" name="${f.id}" id="i-${f.id}-${i}" data-k="${f.id}" value="${esc(o)}"${o===S[f.id]?" checked":""}><span>${esc(o)}</span></label>`).join("")}</div>`;
function field(f,sid){
 if(!vis(f))return "";
 if(f.type==="h")return `<h3 class="sub full">${esc(f.label)}</h3>`;

 if(f.type==="check")
  return `<div class="fld full${err?" err":""}" id="f-${f.id}"><label class="ck"><input type="checkbox" id="i-${f.id}" data-k="${f.id}"${S[f.id]?" checked":""}> ${esc(f.label)}${f.req?' <span class="req">*</span>':""}</label>${err?'<div class="msg">Please confirm to continue</div>':""}</div>`;
 const span=f.span==="full"?" full":f.span===2?" s2":"";
 const lab=f.type==="radio"||f.type==="checks"?`<span class="lbl">`:`<label for="i-${f.id}${f.type==="phone"?"":""}">`;

function cell(c,val,attrs,err){

 return `<td><input class="in${c.type==="num"?" mono":""}" type="${t}" ${attrs}${bad} value="${esc(val)}" aria-label="${esc(c.label)}"${c.type==="num"?' inputmode="decimal"':""}></td>`;
}
const th=c=>`<th${c.type==="cb"?' class="c"':""}${c.w?` style="min-width:${c.w}px"`:""}>${esc(c.label)}${c.req?' <span class="req">*</span>':""}${tip(c.help)}</th>`;
function tableHTML(f,sid){

 ${rows.length?rows.map((r,i)=>`<tr><td class="n">${i+1}</td>${f.cols.map(c=>cell(c,r[c.k],`data-t="${f.id}" data-r="${i}" data-c="${c.k}"`,err)).join("")}<td class="c"><button class="icon-btn" data-act="del" data-t="${f.id}" data-r="${i}" aria-label="Remove row ${i+1}">${trash}</button></td></tr>`).join(""):`<tr><td colspan="${f.cols.length+2}" class="empty">No rows yet.</td></tr>`}
 </tbody></table></div><div class="tbl-foot"><button class="btn sec sm" data-act="add" data-t="${f.id}">+ ${esc(f.add||"Add row")}</button>${missing?'<span class="msg">Add at least one row</span>':""}</div></div>`;

 ${ps.length?ps.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="hint">${esc(p.type||"")}${[p.ubo&&"UBO",p.smo&&"SMO",p.sig&&"Signatory"].filter(Boolean).map(x=>" · "+x).join("")}</div></td>${f.cols.map(c=>cell(c,(store[p._id]||{})[c.k],`data-d="${f.id}" data-p="${p._id}" data-c="${c.k}"`,err)).join("")}</tr>`).join(""):`<tr><td colspan="${f.cols.length+1}" class="empty">${esc(f.empty)} <button class="btn ghost sm" data-go="1:0">Go to related parties</button></td></tr>`}

/* ---------- Documents ---------- */
let docFilter="all",docQ="";
function docList(){
 const d=S.docs||(S.docs={});const out=[];
 DOCS.forEach(([id,name,kind,need])=>{if(need&&!need(S))return;const r=d[id]||{};out.push({id,name,kind,group:kind==="form"?"Forms generated from your answers":"Supporting documents",s:r.s||(kind==="form"?"none":"pend"),file:r.file,c:r.c,demo:r.demo,need:true})});
 parties().filter(p=>p.sig||p.ubo||p.smo).forEach(p=>{["Proof of identity","Proof of address"].forEach((n,i)=>{if(p.type==="Non-individual"&&i===1)return;const id=`rp-${p._id}-${i}`;const r=d[id]||{};
  out.push({id,name:`${n} · ${p.name}`,kind:"upload",group:"Related party documents",s:r.s||"pend",file:r.file,c:r.c,demo:r.demo,need:true})})});
 (S.extraDocs||[]).forEach(x=>{const r=d[x.id]||{};out.push({id:x.id,name:x.name,kind:"upload",group:"Additional documents",s:r.s||"up",file:r.file,c:r.c,need:false})});
 return out;
}
const SLBL={none:["Not generated","none"],gen:["Ready to sign","gen"],pend:["Upload needed","pend"],up:["Uploaded","up"]};
let openCmt=null;
function docsHTML(){
 const all=docList();let L=all;
 if(docFilter==="todo")L=L.filter(x=>x.s!=="up");if(docFilter==="done")L=L.filter(x=>x.s==="up");
 if(docQ)L=L.filter(x=>x.name.toLowerCase().includes(docQ.toLowerCase()));
 const notGen=all.filter(x=>x.kind==="form"&&x.s==="none").length;
 const todo=all.filter(x=>x.need&&x.s!=="up").length;
 const groups=[...new Set(all.map(x=>x.group))];
 return `<div class="drop" id="drop"><div><b>Upload signed forms and supporting documents</b><div class="hint">PDF, JPG or PNG, up to 10 MB each. Drop a file on any row's Upload button, or add an extra document here.</div></div>
  <div class="dact"><button class="btn sec" data-act="gen"${notGen?"":" disabled"}>${notGen?`Generate ${notGen} form${notGen>1?"s":""}`:"All forms generated"}</button><label class="btn pri" for="extraFile">Add other document</label><input type="file" id="extraFile" hidden></div></div>
  <div class="doc-tools"><input class="in" id="docQ" placeholder="Search documents" value="${esc(docQ)}" aria-label="Search documents">
  <div class="chipset">${[["all",`All · ${all.length}`],["todo",`Action needed · ${todo}`],["done",`Uploaded · ${all.filter(x=>x.s==="up").length}`]].map(([k,l])=>`<button class="chip${docFilter===k?" on":""}" data-filter="${k}">${l}</button>`).join("")}</div></div>
  ${groups.map(g=>{const items=L.filter(x=>x.group===g);if(!items.length)return"";return `<div class="dgroup"><h3>${esc(g)} <span>${items.filter(x=>x.s==="up").length}/${items.length}</span></h3><div class="dlist">${items.map(docRow).join("")}</div></div>`}).join("")||`<div class="card empty">No documents match.</div>`}`;
}
function docRow(x){
 const rv=x.s==="up"?((S._wf||{}).docReview||{})[x.id]:null;

 <div class="dact">${x.kind==="form"&&x.s!=="none"?`<button class="btn ghost sm" data-act="dl" data-doc="${x.id}">Open form</button>`:""}
 ${x.s==="up"&&x.file?(x.demo?`<button class="btn ghost sm" data-act="dl" data-doc="${x.id}">View file</button>`:`<a class="btn ghost sm" href="${fileUrl(x.id)}" target="_blank" rel="noopener">View file</a>`):""}
 ${edit&&x.s!=="none"?`<label class="btn sec sm" for="up-${x.id}">${x.s==="up"?"Replace":"Upload"}</label><input type="file" id="up-${x.id}" data-up="${x.id}" hidden>`:""}
 ${edit?`<button class="btn ghost sm" data-act="cmt" data-doc="${x.id}" aria-label="Add note">Note</button>`:""}
 ${opsCan&&x.s==="up"?`<button class="btn sec sm" data-act="docOk" data-doc="${x.id}"${rv&&rv.s==="verified"?" disabled":""}>Verify</button><button class="btn sec sm" data-act="docNo" data-doc="${x.id}">Reject</button>`:""}</div>
 ${openCmt===x.id?`<div class="cmt"><input class="in" id="cmt-${x.id}" placeholder="Add a note for the operations team" value="${esc(x.c||"")}"><button class="btn pri sm" data-act="cmtSave" data-doc="${x.id}">Save note</button></div>`:""}
 ${openRej===x.id?`<div class="rej-note"><input class="in" id="rej-${x.id}" placeholder="Why is this document rejected?"><button class="btn pri sm" data-act="docNoSend" data-doc="${x.id}">Reject document</button></div>`:""}</div>`;

/* ---------- Review ---------- */
function reviewHTML(){

 let left=0;
 const blocks=STEPS.slice(0,-1).map((s,i)=>{
  const rows=s.sections.map((x,j)=>{const t=status(x);const st=stateOf(t);left+=t.miss.length;
   return `<div class="rv-row"><div class="t"><span class="dot ${st}"></span><div><b>${esc(x.title)}</b><small>${t.miss.length?esc(t.miss.slice(0,3).join(", ")+(t.miss.length>3?` and ${t.miss.length-3} more`:"")):"Complete"}</small></div></div>${t.miss.length?`<button class="btn sec sm" data-go="${i}:${j}">Fix ${t.miss.length}</button>`:`<button class="btn ghost sm" data-go="${i}:${j}">View</button>`}</div>`}).join("");
  return `<div class="rv-step"><h3>${i+1}. ${esc(s.title)}</h3>${rows}</div>`;
 }).join("");
 const ready=left===0;

 return `${sub?`<div class="done-banner"><span class="num done">✓</span><div><b>${S._status==="Approved"?"Application approved":S._status==="Rejected"?"Application closed":"Application submitted"}</b><div>Reference <span class="mono">${esc(S._id)}</span>. ${esc(nextStep(S._status,"client",(S._wf||{}).regNo))}</div></div></div>`:""}
 <div class="rv">${blocks}</div>
 ${sub?"":`<div class="card" style="margin-top:16px"><div class="stack">
  <label class="ck"><input type="checkbox" id="finalDecl" data-k="_decl"${S._decl?" checked":""}${sub?" disabled":""}> I confirm the information in this application is true and complete, and I am authorised to submit it on behalf of the applicant.</label>
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn pri" data-act="submit"${!ready||!S._decl?" disabled":""}>${S._status==="Query raised"?"Resubmit application":"Submit application"}</button>
  <span class="hint">${ready?(S._decl?"Ready to submit.":"Tick the declaration to submit."):`${left} item${left>1?"s":""} still missing. Use the Fix buttons above.`}</span></div></div></div>`}`;
}

 if(el.dataset.multi!==undefined){const a=new Set(S[k]||[]);el.checked?a.add(el.dataset.multi):a.delete(el.dataset.multi);S[k]=[...a]}
 else if(el.type==="checkbox")S[k]=el.checked;

 if(a==="wf-cancel"){wfForm=null;renderMain(true)}
 if(a==="wf-send"){const text=$("#wf-text").value.trim();if(!text){toast("Write a note first.");return}const sec=$("#wf-sec");doAct(wfForm,{text,section:sec?sec.value:""})}
 if(a==="wf-reply"){const i=$("#reply-"+b.dataset.q);const text=i&&i.value.trim();if(!text){toast("Write your answer first.");return}doAct("reply",{qid:b.dataset.q,text})}
 if(a==="wf-resolve")doAct("resolve",{qid:b.dataset.q});
 if(a==="docOk"){const d=docList().find(x=>x.id===b.dataset.doc);doAct("doc",{docId:b.dataset.doc,docName:d?d.name:"",s:"verified"})}
 if(a==="docNo"){openRej=openRej===b.dataset.doc?null:b.dataset.doc;renderMain(true);const i=$("#rej-"+b.dataset.doc);if(i)i.focus()}
 if(a==="docNoSend"){const text=$("#rej-"+b.dataset.doc).value.trim();if(!text){toast("Add a reason so the client knows what to fix.");return}const d=docList().find(x=>x.id===b.dataset.doc);doAct("doc",{docId:b.dataset.doc,docName:d?d.name:"",s:"rejected",text})}
 if(a==="home"){closeNav();showHome()}
 if(a==="newSample")createApp(sample());
 if(a==="newBlank")createApp(blank());
 if(a==="delApp"){
  const id=b.dataset.id;
  if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.innerHTML="Delete?";b.classList.add("btn","sm");setTimeout(()=>{if(b.isConnected){b.dataset.confirm="";b.innerHTML=trash;b.classList.remove("btn","sm")}},4000);return}
  api("/"+encodeURIComponent(id),{method:"DELETE"}).then(()=>{apps=apps.filter(x=>x.id!==id);renderHome();toast("Application deleted")}).catch(er=>toast(er.message))}
});
document.addEventListener("click",e=>{
 const o=e.target.closest("[data-open]");if(o){openApp(o.dataset.open);return}
 const h=e.target.closest("[data-hf]");if(h){homeFilter=h.dataset.hf;renderHome()}
});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-login]");if(!f)return;e.preventDefault();signIn(f.dataset.login,$("#login-"+f.dataset.login).value)});
document.addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("wf"))wfOpen=e.target.open},true);
function route(){const id=new URLSearchParams(location.search).get("app");!ME?renderLogin():id?openApp(id,false):showHome(false)}
window.addEventListener("popstate",route);
$("#menuBtn").onclick=()=>document.body.classList.add("nav-open");
$("#scrim").onclick=closeNav;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeNav()});
/* drag-and-drop onto drop zone adds an extra document */
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(!d)return;e.preventDefault();d.classList.remove("over");const f=e.dataTransfer.files[0];if(!f)return;
 uploadDoc("x"+Date.now(),f,f.name.replace(/\.[^.]+$/,""))});

route();
</script>
</body>
</html>
